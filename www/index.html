<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakonor</title>
    
    <!-- Tagi Hreflang wskazujące wersje językowe -->
    <link rel="alternate" hreflang="no" href="/no/">
    <link rel="alternate" hreflang="en" href="/en/">
    <link rel="alternate" hreflang="pl" href="/pl/">
    <link rel="alternate" hreflang="x-default" href="/en/">

    <!-- Natychmiastowe przekierowanie w JavaScript bazujące na języku przeglądarki -->
    <script>
        (function() {
            var userLang = navigator.language || navigator.userLanguage; 
            userLang = userLang ? userLang.toLowerCase() : '';

            if (userLang.startsWith('no')) {
                window.location.replace('/no/');
            } else if (userLang.startsWith('pl')) {
                window.location.replace('/pl/');
            } else {
                window.location.replace('/en/');
            }
        })();
    </script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .links a {
            color: #60a5fa;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Awaryjna treść widoczna, gdy JavaScript jest wyłączony -->
    <noscript>
        <div class="loader">
            <h1>Select your language</h1>
            <div class="links">
                <a href="/no/">Norsk</a> | 
                <a href="/en/">English</a> | 
                <a href="/pl/">Polski</a>
            </div>
        </div>
    </noscript>

</body>
</html>
